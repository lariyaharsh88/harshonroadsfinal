# Netlify build settings (Next.js runtime is detected automatically).
# Secrets (DATABASE_URL, GEMINI_API_KEY, ADMIN_PASSWORD, ADMIN_SESSION_SECRET) are set in the Netlify UI, not here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_SITE_URL = "https://harshonroads.com"
  NEXT_TELEMETRY_DISABLED = "1"
